name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Check imports (smoke test)
        run: |
          python -c "from src.analyze import load_data, flag_outliers, race_summary, driver_stats, team_stats"
          python -c "from src.download_pitstops_openf1 import get_session_key, download_pit_csv"
          python -c "from src.stints import compute_stints, detect_undercuts"
          python -c "from src.compare import load_multiple, compare_teams"
          python -c "from src.report import build_report"
